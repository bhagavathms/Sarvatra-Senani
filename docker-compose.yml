# Sarvatra Senani — local infrastructure
#
#   docker compose up -d
#
# Services
#   postgis     PostgreSQL 16 + PostGIS 3.4 — LangGraph checkpoints (durable HITL pauses)
#               and the geospatial reference layer (auto-seeded by the backend on start).
#   kafka       Apache Kafka 3.8 in single-node KRaft mode (no ZooKeeper).
#               Host clients use localhost:9092; containers use kafka:29092.
#   kafka-init  One-shot job that creates the telemetry + events topics.
#
# Backend env to use this stack:
#   DATABASE_URL=postgresql://senani:senani@localhost:5432/senani
#   KAFKA_BOOTSTRAP_SERVERS=localhost:9092

name: sarvatra-senani

services:
  postgis:
    image: postgis/postgis:16-3.4   # on Apple Silicon use imresamu/postgis:16-3.4
    container_name: senani-postgis
    environment:
      POSTGRES_USER: senani
      POSTGRES_PASSWORD: senani     # local development only — override in any shared environment
      POSTGRES_DB: senani
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senani -d senani"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: senani-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: senani-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in senani.telemetry senani.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

volumes:
  postgis-data:
  kafka-data:
